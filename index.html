  <script type="text/javascript">
    $(document).ready(function () {
      loadModal();
      loadContent();
    });

    //Below provided by 'tdsymonds': https://gist.github.com/tdsymonds/23917215f591a9e1442a38783c77f0f0
    // Select all links with hashes
    $(document).on('click', 'a[href^="#"]', function (event) {
      event.preventDefault();

      $('html, body').animate({
        scrollTop: $($.attr(this, 'href')).offset().top
      }, 500);
    });

    $('div.modal').on('show.bs.modal', function () {
      var modal = this;
      var hash = modal.id;
      window.location.hash = hash;
      window.onhashchange = function () {
        if (!location.hash) {
          $(modal).modal('hide');
        }
        else {
          $(modal).modal('show');
        }
      }
    });

    $('div.modal').on('hidden.bs.modal', function () {
      var hash = this.id;
      history.replaceState('', document.title, window.location.pathname);
    });

    // when close button clicked simulate back
    $('div.modal button.close').on('click', function () {
      window.history.back();
    })

    // when esc pressed when modal open simulate back
    $('div.modal').keyup(function (e) {
      if (e.keyCode == 27) {
        window.history.back();
      }
    });
    var hash = window.location.hash;
    if (hash != '') {
      $(hash).modal('show');
      location.href = location.href;
      console.log("reached page?");
    }

    // FaithPulse Status Tracker - Redesigned
    //const rowNames = ["Devotion to God", "Personal Health", "Family", "Stewardship", "Academics", "Volunteering", "Free Time"];
    const rowNames = ["Scripture Engagement", "Prayer Life", "Obedience, Integrity", "Community, Relationships", "Service, Generosity", "Rest, Emotional Health", "Mission & purpose Alignment"];
    
    // Tooltips for each row - adjustable and modifiable
    const rowTooltips = [
      "Regular engagement with Scripture and God's Word",
      "Consistency and depth in prayer and communion with God",
      "Living with integrity and obedience to God's principles",
      "Quality of relationships and community involvement",
      "Acts of service and generosity towards others",
      "Adequate rest and emotional well-being",
      "Living with purpose aligned to God's mission"
    ];
    
    const statusMap = {}; // Store selected states: {rowIndex: 'green'|'amber'|'red'|null}

    // Initialize status map
    rowNames.forEach((_, index) => {
      statusMap[index] = null;
    });

    // Create table rows
    rowNames.forEach((rowName, index) => {
      // Name row
      const nameRow = $("<tr>").addClass("mdc-data-table__row");
      const nameCell = $("<td>").addClass("mdc-data-table__cell");
      
      // Create a container for the name and tooltip icon
      const nameContainer = $("<div>").addClass("name-tooltip-container").css({
        "display": "flex",
        "align-items": "center",
        "gap": "8px"
      });
      
      nameContainer.append($("<span>").text(rowName));
      
      // Create tooltip icon
      const tooltipIcon = $("<i>")
        .addClass("fa fa-info-circle")
        .attr("data-toggle", "tooltip")
        .attr("title", rowTooltips[index])
        .css({
          "cursor": "pointer",
          "color": "#6c757d",
          "font-size": "14px"
        });
      
      nameContainer.append(tooltipIcon);
      nameCell.append(nameContainer);
      nameRow.append(nameCell);
      $("#table").append(nameRow);
      
      // Initialize tooltip for this icon
      tooltipIcon.tooltip();

      // Buttons row
      const buttonRow = $("<tr>").addClass("mdc-data-table__row");
      const buttonCell = $("<td>").addClass("mdc-data-table__cell");

      // Create three buttons with click handlers
      const colors = [
        { name: 'green', label: 'Good', state: 'success', display: 'Green' },
        { name: 'amber', label: 'Okay', state: 'warning', display: 'Amber' },
        { name: 'red', label: 'Poor', state: 'danger', display: 'Red' }
      ];

      colors.forEach(color => {
        const buttonContainer = $("<div>").addClass("pretty p-default p-curve");
        const input = $("<input>")
          .attr("type", "radio")
          .attr("name", "status_" + index)
          .attr("id", "status_" + index + "_" + color.name)
          .attr("data-row-index", index)
          .attr("data-color", color.name)
          .attr("data-display", color.display);

        const stateDiv = $("<div>").addClass("state p-" + color.state + "-o");
        const label = $("<label>")
          .attr("for", "status_" + index + "_" + color.name)
          .attr("title", color.label);

        stateDiv.append(label);
        buttonContainer.append(input);
        buttonContainer.append(stateDiv);
        buttonCell.append(buttonContainer);

        // Add click handler to update status map
        input.on("change", function () {
          if (this.checked) {
            statusMap[index] = color.name;
            console.log("Updated status map:", statusMap);
          }
        });
      });

      buttonRow.append(buttonCell);
      $("#table").append(buttonRow);
    });

    // Detect Android and iOS devices
    const isMobileDevice = () => {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      return isAndroid || isIOS;
    };

    // Function to copy status to clipboard
    function copyStatusToClipboard() {
      let statusText = "";
      const displayMap = {
        'green': 'Green',
        'amber': 'Amber',
        'red': 'Red'
      };

      for (let i = 0; i < rowNames.length; i++) {
        const selectedColor = statusMap[i];
        const displayValue = selectedColor ? displayMap[selectedColor] : 'Not Set';
        statusText += rowNames[i] + ": " + displayValue + "\n";
      }

      console.log('Final status text:', statusText);

      // Copy to clipboard
      navigator.clipboard.writeText(statusText.trim()).then(function () {
        // Show feedback only on non-mobile devices (mobile has native clipboard notification)
        if (!isMobileDevice()) {
          $('#copyFeedback').show();
          setTimeout(function () {
            $('#copyFeedback').fadeOut();
          }, 2000);
        }
      }).catch(function (err) {
        console.error('Failed to copy: ', err);
        alert('Failed to copy status to clipboard');
      });
    }

    // Attach click handler to copy button
    $(document).on('click', '#copyStatusBtn', function () {
      copyStatusToClipboard();
    });
  </script>
